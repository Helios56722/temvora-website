<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TemVora Business Card — QR Proof</title>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#090713;color:#f7f1f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2a1045 0,transparent 42%),#090713;padding:clamp(24px,5vw,72px)}main{max-width:1240px;margin:auto}header{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:34px}h1{margin:0;font:400 clamp(32px,5vw,64px)/1.02 Georgia,serif}p{margin:.5rem 0 0;color:#cbbfd2;line-height:1.55}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(22px,3vw,42px)}figure{margin:0}img{display:block;width:100%;height:auto;border:1px solid #ffffff28;box-shadow:0 28px 70px #0009}figcaption{display:flex;justify-content:space-between;gap:20px;padding:14px 2px 0;color:#e8ddeb;font-size:14px}.details{margin-top:38px;padding-top:22px;border-top:1px solid #ffffff26;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:14px}.details a{color:#f2c9f5;text-underline-offset:4px}@media(max-width:780px){header{display:block}.cards{grid-template-columns:1fr}.details{display:block}.details p{margin-bottom:12px}}
</style>
</head>
<body>
<main>
<header><div><h1>TemVora business card</h1><p>Production proof with 0.125-inch bleed. Front first, QR-equipped back second.</p></div><p>3.5 × 2 in trim · 300 DPI</p></header>
<section class="cards" aria-label="Business card sides">
<figure><img src="images/TemVora_Card_Front_300dpi_Bleed.png" alt="TemVora business card front with the wordmark and nine services"><figcaption><span>Front</span><span>Services</span></figcaption></figure>
<figure><img src="images/TemVora_Card_Back_300dpi_Bleed.png" alt="TemVora business card back with contact information and website QR code"><figcaption><span>Back</span><span>Live website QR</span></figcaption></figure>
</section>
<div class="details"><p>QR destination: <a href="https://temvora.helios56722.chatgpt.site">temvora.helios56722.chatgpt.site</a></p><p><a href="pdf/TemVora_Business_Card_Print_Ready.pdf">Open the two-page print-ready PDF</a></p></div>
</main>
</body>
</html>
